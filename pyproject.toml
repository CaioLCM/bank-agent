[project]
name = "arq-agnt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
